---
layout: default
title: Gamma — Contacto
description: Escribinos y te contestamos nosotros.
turnstile: true
---

<div class="contacto-doble">
	<section class="encabezado">
		<h1 data-es="¿Querés saber qué decisión conviene automatizar primero?"
			data-en="Want to know which decision to automate first?">¿Querés saber qué decisión conviene automatizar primero?</h1>
		<p class="entrada" data-html
		data-es="Escribinos completando el formulario o mandando un mail a <a href='mailto:info@gamma.ar'>info@gamma.ar</a>."
		data-en="Write to us by filling out the form or sending an email to <a href='mailto:info@gamma.ar'>info@gamma.ar</a>.">
			Escribinos completando el formulario o mandando un mail a <a href="mailto:info@gamma.ar">info@gamma.ar</a>.
		</p>
	</section>

	<section class="bloque-form">
		<p class="nota-form" data-es="Los campos con * son obligatorios." data-en="Fields marked * are required.">Los campos con * son obligatorios.</p>
		<form id="form-contacto" novalidate>
			<label for="c-nombre" data-req data-es="Nombre" data-en="Name">Nombre</label>
			<input id="c-nombre" name="nombre" type="text" required maxlength="120" autocomplete="name">

			<label for="c-empresa" data-es="Empresa" data-en="Company">Empresa</label>
			<input id="c-empresa" name="empresa" type="text" maxlength="120" autocomplete="organization">

			<label for="c-correo" data-req data-es="Correo electrónico" data-en="Email">Correo electrónico</label>
			<input id="c-correo" name="correo" type="email" required maxlength="200" autocomplete="email">

			<label for="c-mensaje" data-req data-es="Mensaje" data-en="Message">Mensaje</label>
			<textarea id="c-mensaje" name="mensaje" rows="7" required maxlength="2000"></textarea>

			<div id="turnstile-form"></div>

			<button class="boton" type="submit" data-es="Enviar" data-en="Send">Enviar</button>
			<p class="aviso-form" id="aviso-form" role="status" aria-live="polite"></p>
		</form>
	</section>
</div>
